name: Validate Mây
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Fake public configuration: cloud E2E intercepts all Supabase requests.
      NEXT_PUBLIC_SUPABASE_URL: https://may-e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/test-production.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
